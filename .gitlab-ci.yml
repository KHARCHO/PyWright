# GitLab CI. Pipelines start on demand (CI/CD > Pipelines > Run pipeline) or on a schedule, not on push.
# Secrets come from CI/CD variables: APP_USERNAME, APP_PASSWORD, and QASE_MODE=testops + QASE_TESTOPS_PROJECT + QASE_TESTOPS_API_TOKEN to report to Qase.
image: mcr.microsoft.com/playwright/python:v1.64.1-noble

stages: [lint, test]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

cache:
  key: pip
  paths: [.cache/pip]

lint:
  stage: lint
  script:
    - pip install -r requirements.txt
    - ruff check .

tests:
  stage: test
  script:
    - pip install -r requirements.txt
    - python -m pytest -n auto --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [reports/]
    reports:
      junit: reports/junit.xml
