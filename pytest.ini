[pytest]
# Project root on sys.path so tests can import config / pages / api
pythonpath = .
testpaths = tests

# Screenshots + traces are kept only for failed tests
addopts =
    -ra
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html

# Harmless packaging quirk of qase-pytest
filterwarnings =
    ignore:Module already imported so cannot be rewritten; pytest:pytest.PytestAssertRewriteWarning

markers =
    smoke: fast critical-path checks
    regression: full regression suite
    ui: browser tests
    api: API tests
